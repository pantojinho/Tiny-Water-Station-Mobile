; Estacao Meteo — Waveshare ESP32-S3-Touch-AMOLED-1.64
[platformio]
src_dir = .
default_envs = estacao_meteo

[env:estacao_meteo]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DLV_CONF_PATH=${platformio.src_dir}/lv_conf.h
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    https://github.com/moononournation/Arduino_GFX.git#v1.5.5
    https://github.com/lvgl/lvgl.git#v9.2.0
    https://github.com/adafruit/Adafruit_BMP5xx.git#1.0.2
upload_protocol = esptool
